[project]
name = "kidsi"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.31,<1",
    "httpx>=0.28,<1",
    "mcp>=1.26,<2",
    "openpyxl>=3.1,<4",
    "pydantic>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "starlette>=0.49,<1",
    "uvicorn>=0.38,<1",
]

[project.scripts]
kidsic-search = "KIDSic.commands.search:main"
kidsic-register-sources = "KIDSic.commands.register_sources:main"
kidsic-sync-kindergartens = "KIDSic.commands.sync_kindergartens:main"
kidsic-sync-historical = "KIDSic.commands.sync_historical:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/KIDSic"]
