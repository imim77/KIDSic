[project]
name = "kidsi"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.31,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.scripts]
kidsic-search = "KIDSic.commands.search:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/KIDSic"]
