services:
  database:
    build:
      context: .
      dockerfile: src/KIDSic/db/Dockerfile
    image: kidsic-db:rag
    environment:
      POSTGRES_USER: kidsic
      POSTGRES_PASSWORD: kidsic_local
      POSTGRES_DB: kidsic
    ports:
      # Connect via localhost:55432; Docker requires a numeric loopback bind address.
      - "127.0.0.1:55432:5432"
    volumes:
      - kidsic_database:/var/lib/postgresql/data
      - ./snapshots:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The initialization server only uses a socket; TCP is ready after import.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kidsic -d kidsic"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kidsic_database:
