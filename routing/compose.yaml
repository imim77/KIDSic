services:
  otp:
    image: opentripplanner/opentripplanner:2.8.1
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx4g
    volumes:
      - ./data:/var/opentripplanner
    command: ["--load", "--serve"]
  otp-zagreb:
    image: opentripplanner/opentripplanner:2.8.1
    profiles: [zagreb]
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx4g
    volumes:
      - ./data/zagreb:/var/opentripplanner
    command: ["--load", "--serve"]
  otp-sibenik:
    image: opentripplanner/opentripplanner:2.8.1
    profiles: [sibenik]
    ports:
      - "127.0.0.1:18082:8080"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx3g
    volumes:
      - ./data/sibenik:/var/opentripplanner
    command: ["--load", "--serve"]
