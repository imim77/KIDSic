purpose:
  stands_in_for: Croatian CKAN package_show endpoints and the three selected JSON resources.
  unblocks: Real HTTP checks of registration, downloads, error handling and snapshot imports.
assumptions:
  - id: package-envelope
    status: supported
    claim: The selected public catalogues return a boolean success and package metadata with resource URLs.
    reason: CKAN documents the envelope, and all three live endpoints returned it on 2026-11-01.
    verification: Fetched the national and two Zagreb package_show responses; extracted metadata fixtures.
    source: https://docs.ckan.org/en/2.11/api/index.html; tests/fixtures/ckan_national.json; tests/fixtures/ckan_municipal.json; tests/fixtures/ckan_other.json
    updated_at: '2026-11-01'
  - id: public-json-records
    status: supported
    claim: The three selected resource downloads contain JSON arrays of objects and need no API token.
    reason: All three live resources were downloaded without credentials and parsed on 2026-11-01.
    verification: Normalized 885 national rows, 241 municipal objects and 130 other Zagreb providers; all passed field validation.
    source: tests/fixtures/README.md; src/KIDSic/services/concrete/kindergarten_normalizer.py
    updated_at: '2026-11-01'
  - id: simulated-caller-errors
    status: supported
    claim: The caller distinguishes HTTP errors, action errors, invalid JSON and timeouts over actual HTTP.
    reason: The real httpx client raised the expected distinct errors against this local simulation.
    verification: On 2026-11-01 ran all 34 tests with the simulation URL and a migrated disposable PostgreSQL database. Logs showed package_show and resource GETs, HTTP 503/500, HTTP 200 action failure, HTML and a 250 ms delayed response exceeding the 50 ms test timeout. The full HTTP-to-database test imported four synthetic records into two institutions and three locations, then proved unchanged active batches after a failed download. These observations establish caller behavior in the simulated cases, not future upstream availability.
    source: tests/test_ckan_http.py; postman/mocks/ckan/default.js
    updated_at: '2026-11-01'
fingerprints:
  - id: ckan-implementation
    date: '2026-11-01'
    commit: 9e06f274e00c03a28926912ff8e6deca7800d95f with uncommitted CKAN implementation
    cli: Postman 1.77.0
